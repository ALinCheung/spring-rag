server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: spring-rag
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# Custom config
rag:
  model:
    # 模型目录（与本项目绑定，相对路径指向 src/main/resources/model 下）
    path: src/main/resources/model/bge-small-zh-v1.5
  chunk:
    size: 200
    overlap: 30

logging:
  level:
    root: INFO
    com.example.rag: DEBUG
